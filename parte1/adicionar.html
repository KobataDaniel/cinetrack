<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar filme - CineTrack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="index.html">← Voltar</a>
    <h1>Adicionar filme</h1>
    
    <form id="form-filme" action="index.html" method="post">
        <div class="campo">
            <label>Título</label>
            <input type="text" name="titulo" required="required">
        </div>
        
        <div class="campo">
            <label>Ano</label>
            <input type="number" name="ano" min="1888" max="2030">
        </div>
        
        <div class="campo">
            <label>Gênero</label>
            <input type="text" name="genero" required="required">
        </div>
        
        <div class="campo">
            <label>URL do pôster</label>
            <input type="text" name="url">
        </div>
        
        <div class="campo">
            <label>Status</label>
            <select name="status" required="required">
                <option>Quero assistir</option>
                <option>Assistindo</option>
                <option>Assistido</option>
            </select>
        </div>
        
        <div class="campo">
            <label>Nota(1 a 5)</label>
            <input type="number" name="nota" min="1" max="5">
        </div>
        
        <div class="campo">
            <label>Comentário</label>
            <textarea name="comentario"></textarea>
        </div>
        
        <div class="acoes">
            <button type="button">Cancelar</button>
            <button type="submit">Salvar</button>
        </div>
    </form>
    
    <footer>
        <p>CineTrack - UEM</p>
    </footer>
</body>
</html>
