<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar filme - CineTrack</title>
</head>
<body>
    <a href="index.html">← Voltar</a>
    <h1>Adicionar filme</h1>
    <form id="form-filme" action="index.html" method="post">
        <label>Título<br><input type="text required="required"></label><br>
        <label>Ano<br><input type="number" min="1888" max="2030"></label><br>
        <label>Gênero<br><input type="text" required="required"></label><br>
        <label>URL do pôster<br><input type="text"></label><br>
        <label>Status<br>
            <select required="required">
                <option>Quero assistir</option>
                <option>Assistindo</option>
                <option>Assistido</option>
            </select><br>
        </label>
        <label>Nota(1 a 5)<br><input type="number" min="1" max="5"></label><br>
        <label>Comentário<br><textarea></textarea></label><br>
        <button type="button">Cancelar</button>
        <button type="submit">Salvar</button>
    </form>
</body>
</html>
