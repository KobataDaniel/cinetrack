<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar filme - CineTrack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="index.html">← Voltar</a>
    <h1>Adicionar filme</h1>
    <form id="form-filme" action="index.html" method="post">
        <label>Título<br><input type="text" name="titulo" required="required"></label><br>
        <label>Ano<br><input type="number" name="ano" min="1888" max="2030"></label><br>
        <label>Gênero<br><input type="text" name="genero" required="required"></label><br>
        <label>URL do pôster<br><input type="text" name="url" ></label><br>
        <label>Status<br>
            <select name="status" required="required">
                <option>Quero assistir</option>
                <option>Assistindo</option>
                <option>Assistido</option>
            </select><br>
        </label>
        <label>Nota(1 a 5)<br><input type="number" name="nota" min="1" max="5"></label><br>
        <label>Comentário<br><textarea name="comentario"></textarea></label><br>
        <button type="button">Cancelar</button>
        <button type="submit">Salvar</button>
    </form>
    <footer>
        <p>CineTrack - UEM</p>
    </footer>
</body>
</html>
