<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineTrack</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>CineTrack</h1>

        <input type="search" aria-label="Buscar Filme">

        <button class="add_big">+ Adicionar</button>
        <button class="add_small">+</button>
    </header>

    <nav aria-label="Filtro de Status">
        <button class="ativo">Todos</button>
        <button>Assistido</button>
        <button>Assistindo</button>
        <button>Quero assistir</button>
    </nav>

    <main>
        <section id="lista" aria-live="polite">
            <!-- Cards feitos no js -->
        </section>

        <footer>
            <p><a href="adicionar.html">+ Adicionar</a></p>
            <p><a href="sobre.html">Sobre</a></p>
            <p><small id="total-filmes"></small></p>
        </footer>
    </main>

    <div id="modal" hidden>
        <div class="modal-conteudo">

            <button class="modal-fechar" type="button" aria-label="Fechar modal">
                ×
            </button>

            <h2>Adicionar filme</h2>

            <form id="form-filme" action="index.html" method="post">

                <div class="campo">
                    <label>Título</label>
                    <input type="text" name="titulo" required="required">
                </div>

                <div class="campo">
                    <label>Ano</label>
                    <input type="number" name="ano" min="1888" max="2030">
                </div>

                <div class="campo">
                    <label>Gênero</label>
                    <input type="text" name="genero" required="required">
                </div>

                <div class="campo">
                    <label>URL do pôster</label>
                    <input type="text" name="url">
                </div>

                <div class="campo">
                    <label>Status</label>
                    <select name="status" required="required">
                        <option>Quero assistir</option>
                        <option>Assistindo</option>
                        <option>Assistido</option>
                    </select>
                </div>

                <div class="campo">
                    <label>Nota(1 a 5)</label>
                    <input type="number" name="nota" min="1" max="5">
                </div>

                <div class="campo">
                    <label>Comentário</label>
                    <textarea name="comentario"></textarea>
                </div>

                <div class="acoes">
                    <button type="button">Cancelar</button>
                    <button type="submit">Salvar</button>
                </div>

            </form>
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
